name: Fork release

# Builds this fork for Windows, Linux and Mac, and publishes them as a GitHub release when a vX.Y.Z.W tag is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and smoke test
        shell: pwsh
        run: ./ci/build-windows.ps1 -OutputDirectory out/windows -SmokeTest -SmokeSeconds 180
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/windows/Capri.exe
            out/windows/Capri-Setup.exe

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: |
          dotnet publish cross/Capri.Cross.csproj -c Release -r linux-x64 --self-contained -o out/Capri -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          chmod +x out/Capri/Capri
          tar -czf Capri-linux-x64.tar.gz -C out Capri
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Capri-linux-x64.tar.gz

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: |
          set -e
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' cross/Capri.Cross.csproj)
          mkdir -p Capri.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s cross/icon.png --out Capri.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d cross/icon.png --out Capri.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns Capri.iconset -o Capri.icns
          for arch in arm64 x64; do
            dotnet publish cross/Capri.Cross.csproj -c Release -r osx-$arch --self-contained -o out/$arch -p:DebugType=none
            app=dist/$arch/Capri.app
            mkdir -p $app/Contents/MacOS $app/Contents/Resources
            cp -R out/$arch/. $app/Contents/MacOS/
            sed "s/@VERSION@/$version/g" cross/mac/Info.plist > $app/Contents/Info.plist
            cp Capri.icns $app/Contents/Resources/Capri.icns
            codesign --force --deep --sign - $app
            cp cross/mac/If-Capri-wont-open.txt "dist/$arch/If Capri won't open.txt"
          done
          (cd dist/arm64 && ditto -c -k . ../../Capri-mac-apple-silicon.zip)
          (cd dist/x64 && ditto -c -k . ../../Capri-mac-intel.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            Capri-mac-apple-silicon.zip
            Capri-mac-intel.zip

  release:
    needs: [windows, linux, mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "Capri fork $GITHUB_REF_NAME" --notes "Unofficial fork of Capri. These builds aren't code-signed. See the README for what it adds and where it has been tested."
